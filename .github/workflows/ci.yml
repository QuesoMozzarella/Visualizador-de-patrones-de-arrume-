name: CI

on:
  push:
  pull_request:

jobs:
  comprobaciones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el proyecto
        run: pip install -e ".[dev]"

      - name: Estilo y errores comunes (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest
