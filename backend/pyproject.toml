[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arrume"
version = "0.1.0"
description = "Backend de Arrume: calculo del arrume (pallet loading) y API Flask"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["arrume*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Permite ejecutar "pytest" sin instalar el paquete antes
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E/W estilo, F errores reales, I imports ordenados, B trampas comunes,
# UP modismos viejos, SIM simplificaciones
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Los tests importan los helpers de invariantes desde el propio directorio
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["arrume", "arrume_api"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

[[tool.mypy.overrides]]
# reportlab no trae tipos (y los de types-reportlab no encajan con su API)
module = "reportlab.*"
ignore_missing_imports = true
